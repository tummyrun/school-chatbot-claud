<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-dark:   #1a6b4a;
    --green-mid:    #2d9467;
    --green-light:  #e8f5ef;
    --green-accent: #34c47c;
    --bg:           #f4f7f5;
    --white:        #ffffff;
    --text-dark:    #0f1f18;
    --text-mid:     #4a6358;
    --text-light:   #8aab98;
    --border:       #d6e8de;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-wrapper {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 700px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 2px 4px rgba(26,107,74,0.04),
      0 12px 40px rgba(26,107,74,0.10),
      0 0 0 1px rgba(26,107,74,0.08);
    background: var(--white);
  }

  /* Header */
  .header {
    background: var(--green-dark);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .header-text .title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .header-text .subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .online-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green-accent);
    box-shadow: 0 0 0 2px rgba(52,196,124,0.3);
    animation: pulse 2.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(52,196,124,0.3); }
    50%       { box-shadow: 0 0 0 4px rgba(52,196,124,0.1); }
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--bg);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: rise 0.22s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .bubble {
    max-width: 75%;
    padding: 11px 15px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
    border-radius: 16px;
  }

  .msg-row.bot .bubble {
    background: var(--white);
    color: var(--text-dark);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--green-dark);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  /* Typing indicator */
  .typing-bubble {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .typing-bubble span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-light);
    display: inline-block;
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%            { transform: translateY(-5px); opacity: 1; }
  }

  /* Suggestion chips */
  .suggestions {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .suggestions-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .suggestion-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--green-dark);
    background: var(--green-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    width: 100%;
  }

  .suggestion-chip:hover {
    background: var(--green-dark);
    color: #fff;
    border-color: var(--green-dark);
  }

  /* Submit unanswered button */
  .submit-row {
    margin-top: 10px;
  }

  .submit-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: all 0.15s;
  }

  .submit-btn:hover {
    border-color: var(--green-mid);
    color: var(--green-dark);
    background: var(--green-light);
  }

  /* Loading state */
  .loading-text {
    font-size: 13px;
    color: var(--text-light);
    font-style: italic;
  }

  /* Quick replies */
  .quick-bar {
    padding: 12px 18px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .quick-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 100%;
  }

  .quick-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--green-dark);
    background: var(--green-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .quick-btn:hover {
    background: var(--green-dark);
    color: #fff;
    border-color: var(--green-dark);
  }

  /* Input */
  .input-area {
    padding: 14px 18px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  input {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 15px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input:focus {
    border-color: var(--green-mid);
    background: #fff;
  }

  input::placeholder { color: var(--text-light); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--green-dark);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover  { background: var(--green-mid); }
  .send-btn:active { transform: scale(0.93); }

  .send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>

<div class="chat-wrapper">

  <div class="header">
    <div class="header-icon">🎓</div>
    <div class="header-text">
      <div class="title">Student Assistant</div>
      <div class="subtitle">
        <span class="online-dot"></span> Online — here to help
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-row bot">
      <div class="bubble loading-text">Loading questions from server...</div>
    </div>
  </div>

  <div class="quick-bar" id="quickBar">
    <span class="quick-label">Loading...</span>
  </div>

  <div class="input-area">
    <input id="userInput" type="text" placeholder="Ask a question..."
           onkeydown="if(event.key==='Enter') sendMessage()" disabled />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwv5CPhIBL9-qTwOBS29_Fn5TT8RxqrqvB9_86Gxnu374-095mLnITTQCqzvkV3RWBUmQ/exec";
  const TOP_FALLBACK_COUNT = 3;
  // ──────────────────────────────────────────────────────────────

  let keywordData = []; // loaded from Google Sheets

  // ── Load data from Google Sheets on startup ──────────────────
  async function loadKeywords() {
    try {
      const res = await fetch(APPS_SCRIPT_URL);
      const data = await res.json();

      // Group rows by response so multiple keywords share one entry
      const grouped = {};
      data.forEach(({ keyword, response }) => {
        if (!grouped[response]) {
          grouped[response] = { keywords: [], question: keyword, response };
        }
        grouped[response].keywords.push(keyword);
      });

      keywordData = Object.values(grouped);

      // Clear loading message and show welcome
      const box = document.getElementById('messages');
      box.innerHTML = '';
      addMessage("Hello! I'm your Student Assistant. Feel free to ask me anything about the school.", 'bot');

      // Build quick reply buttons from first 3 entries
      buildQuickBar();

      document.getElementById('userInput').disabled = false;
      document.getElementById('userInput').focus();

    } catch (err) {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      addMessage("⚠️ Could not connect to the server. Please try again later.", 'bot');
      console.error(err);
    }
  }

  function buildQuickBar() {
    const bar = document.getElementById('quickBar');
    const top = keywordData.slice(0, 3);
    bar.innerHTML = `<span class="quick-label">Quick questions</span>` +
      top.map(e => `<button class="quick-btn" onclick="sendHint('${e.keywords[0]}')">${e.question}</button>`).join('');
  }

  // ── Matching logic ───────────────────────────────────────────
  function getWords(str) {
    return str.toLowerCase().split(/\s+/).filter(Boolean);
  }

  // Score how well an entry matches the input
  function scoreEntry(input, entry) {
    const lower = input.toLowerCase();
    const inputWords = getWords(input);
    let score = 0;
    for (const kw of entry.keywords) {
      const kwLower = kw.toLowerCase();
      // Full phrase match — highest score
      if (lower.includes(kwLower)) {
        score += kwLower.split(' ').length * 2;
      } else {
        // Partial word match — lower score
        for (const word of inputWords) {
          if (kwLower.includes(word) || word.includes(kwLower.split(' ')[0])) {
            score += 1;
          }
        }
      }
    }
    return score;
  }

  function getResult(input) {
    // Score all entries
    const scored = keywordData
      .map(entry => ({ entry, score: scoreEntry(input, entry) }))
      .filter(item => item.score > 0)
      .sort((a, b) => b.score - a.score);

    // No match at all
    if (scored.length === 0) return { type: 'fallback' };

    // Only one keyword match — answer directly
    if (scored.length === 1) {
      return { type: 'answer', text: scored[0].entry.response };
    }

    // Multiple keyword matches found
    const topScore = scored[0].score;
    const multiMatches = scored.filter(item => item.score >= topScore * 0.6);

    if (multiMatches.length === 1) {
      // Multiple keywords found but only one clear winner — answer directly
      return { type: 'answer', text: multiMatches[0].entry.response };
    }

    // Multiple keywords AND multiple answers — check if responses differ
    const uniqueResponses = [...new Set(multiMatches.map(m => m.entry.response))];

    if (uniqueResponses.length === 1) {
      // Multiple keywords but all point to the same answer — just answer
      return { type: 'answer', text: uniqueResponses[0] };
    }

    // Truly multiple different answers — answer best score + notify
    return {
      type: 'multi',
      best: multiMatches[0].entry,
      others: multiMatches.slice(1)
    };
  }

  // ── Submit unanswered question to Google Sheets ──────────────
  async function submitUnanswered(question) {
    try {
      await fetch(APPS_SCRIPT_URL + '?action=submit&question=' + encodeURIComponent(question), {
        method: 'GET',
        mode: 'no-cors'
      });
    } catch (err) {
      console.error('Failed to submit unanswered question:', err);
    }
  }

  // ── DOM helpers ──────────────────────────────────────────────
  function scrollBottom() {
    const box = document.getElementById('messages');
    box.scrollTop = box.scrollHeight;
  }

  function addMessage(text, who) {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg-row ${who}`;
    row.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(row);
    scrollBottom();
  }

  function showTyping() {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
    box.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function addSuggestions(matches, intro, showSubmit, originalQuestion) {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const chips = matches.map(m =>
      `<button class="suggestion-chip" onclick="sendHint('${m.keywords[0]}')">${m.question}</button>`
    ).join('');

    const submitHtml = showSubmit
      ? `<div class="submit-row">
           <button class="submit-btn" onclick="handleSubmitUnanswered('${originalQuestion.replace(/'/g, "\\'")}', this)">
             📩 Submit this question to the team
           </button>
         </div>`
      : '';

    row.innerHTML = `
      <div class="bubble">
        ${intro}
        <div class="suggestions">
          <span class="suggestions-label">Suggestions</span>
          ${chips}
        </div>
        ${submitHtml}
      </div>`;
    box.appendChild(row);
    scrollBottom();
  }

  async function handleSubmitUnanswered(question, btn) {
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    await submitUnanswered(question);
    btn.textContent = '✅ Submitted! We\'ll add it soon.';
    btn.style.color = 'var(--green-dark)';
    btn.style.borderColor = 'var(--green-accent)';
  }

  // ── Main send logic ──────────────────────────────────────────
  function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    if (!text || input.disabled) return;

    addMessage(text, 'user');
    input.value = '';
    input.disabled = true;

    showTyping();

    setTimeout(() => {
      hideTyping();
      input.disabled = false;
      input.focus();

      const result = getResult(text);

      if (result.type === 'answer') {
        addMessage(result.text, 'bot');

      } else if (result.type === 'multi') {
        // Answer the best match first
        addMessage(result.best.response, 'bot');
        // Then show a notice + other matched questions as chips
        addSuggestions(
          result.others,
          "💬 It looks like you asked multiple questions! I've answered the most relevant one. Feel free to ask your other question!",
          false,
          text
        );

      } else if (result.type === 'suggest') {
        addSuggestions(
          result.matches,
          "I'm not sure what you mean. Did you mean one of these?",
          true,
          text
        );

      } else {
        const fallback = keywordData.slice(0, TOP_FALLBACK_COUNT);
        addSuggestions(
          fallback,
          "I couldn't find anything related to that. Here are some things I can help with:",
          true,
          text
        );
      }
    }, 900);
  }

  function sendHint(kw) {
    document.getElementById('userInput').value = kw;
    sendMessage();
  }

  // ── Init ─────────────────────────────────────────────────────
  loadKeywords();
</script>

</body>
</html>
