<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f5f7fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .chat-container {
    width: 100%;
    max-width: 440px;
    height: 90vh;
    max-height: 680px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 16px 20px;
    background: #fff;
    border-bottom: 1px solid #eaecf0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    background: #eef2ff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-info .name {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
  }

  .header-info .status {
    font-size: 12px;
    color: #6b7280;
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: #22c55e;
    border-radius: 50%;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #e5e7eb transparent;
    background: #f9fafb;
  }

  .message-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message-row.user { flex-direction: row-reverse; }

  .bubble {
    max-width: 74%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 400;
  }

  .message-row.bot .bubble {
    background: #ffffff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }

  .message-row.user .bubble {
    background: #4f46e5;
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  /* Hint bar */
  .hint-bar {
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: #fff;
    border-top: 1px solid #eaecf0;
  }

  .hint {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #374151;
    cursor: pointer;
    transition: all 0.15s;
  }

  .hint:hover {
    background: #4f46e5;
    color: #fff;
    border-color: #4f46e5;
  }

  /* Input */
  .input-row {
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: #fff;
    border-top: 1px solid #eaecf0;
  }

  input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #111827;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input:focus {
    border-color: #4f46e5;
    background: #fff;
  }

  input::placeholder { color: #9ca3af; }

  .send-btn {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: #4f46e5;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover  { background: #4338ca; }
  .send-btn:active { transform: scale(0.94); }

  .send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>

<div class="chat-container">

  <div class="header">
    <div class="avatar">🎓</div>
    <div class="header-info">
      <div class="name">Student Assistant</div>
      <div class="status"><span class="status-dot"></span> Online</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="message-row bot">
      <div class="bubble">Hi! I'm your student assistant. How can I help you today?</div>
    </div>
  </div>

  <div class="hint-bar">
    <button class="hint" onclick="sendHint('hello')">Hello</button>
    <button class="hint" onclick="sendHint('location')">📍 Location</button>
    <button class="hint" onclick="sendHint('schedule')">🕗 Schedule</button>
  </div>

  <div class="input-row">
    <input id="userInput" type="text" placeholder="Type a message..."
           onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  // ─── KEYWORD DATA ─────────────────────────────────────────────
  // Add or edit your keyword/response pairs here.
  const keywords = [
    { keyword: "hello",    response: "Hi! How can I help you today?" },
    { keyword: "location", response: "📍 We are located in Bangkok." },
    { keyword: "schedule", response: "🕗 School starts at 8:00 AM." },
  ];
  // ──────────────────────────────────────────────────────────────

  function getResponse(input) {
    const lower = input.toLowerCase();
    for (const entry of keywords) {
      if (lower.includes(entry.keyword)) return entry.response;
    }
    return "I'm not sure about that. Try asking about: " +
           keywords.map(k => k.keyword).join(", ") + ".";
  }

  function addMessage(text, who) {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `message-row ${who}`;
    row.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    setTimeout(() => addMessage(getResponse(text), 'bot'), 350);
  }

  function sendHint(kw) {
    document.getElementById('userInput').value = kw;
    sendMessage();
  }
</script>

</body>
</html>
