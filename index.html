<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-dark:   #1a6b4a;
    --green-mid:    #2d9467;
    --green-light:  #e8f5ef;
    --green-accent: #34c47c;
    --bg:           #f4f7f5;
    --white:        #ffffff;
    --text-dark:    #0f1f18;
    --text-mid:     #4a6358;
    --text-light:   #8aab98;
    --border:       #d6e8de;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-wrapper {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 700px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 2px 4px rgba(26,107,74,0.04),
      0 12px 40px rgba(26,107,74,0.10),
      0 0 0 1px rgba(26,107,74,0.08);
    background: var(--white);
  }

  /* Header */
  .header {
    background: var(--green-dark);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .header-text .title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .header-text .subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .online-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green-accent);
    box-shadow: 0 0 0 2px rgba(52,196,124,0.3);
    animation: pulse 2.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(52,196,124,0.3); }
    50%       { box-shadow: 0 0 0 4px rgba(52,196,124,0.1); }
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--bg);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: rise 0.22s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .bubble {
    max-width: 75%;
    padding: 11px 15px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
    border-radius: 16px;
  }

  .msg-row.bot .bubble {
    background: var(--white);
    color: var(--text-dark);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--green-dark);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  /* Typing indicator */
  .typing-bubble {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .typing-bubble span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-light);
    display: inline-block;
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%            { transform: translateY(-5px); opacity: 1; }
  }

  /* Suggestion chips */
  .suggestions {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .suggestions-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .suggestion-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--green-dark);
    background: var(--green-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    width: 100%;
  }

  .suggestion-chip:hover {
    background: var(--green-dark);
    color: #fff;
    border-color: var(--green-dark);
  }

  /* Quick replies */
  .quick-bar {
    padding: 12px 18px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .quick-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 100%;
  }

  .quick-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--green-dark);
    background: var(--green-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .quick-btn:hover {
    background: var(--green-dark);
    color: #fff;
    border-color: var(--green-dark);
  }

  /* Input */
  .input-area {
    padding: 14px 18px;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  input {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 15px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input:focus {
    border-color: var(--green-mid);
    background: #fff;
  }

  input::placeholder { color: var(--text-light); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--green-dark);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover  { background: var(--green-mid); }
  .send-btn:active { transform: scale(0.93); }

  .send-btn svg { width: 16px; height: 16px; fill: #fff; }
</style>
</head>
<body>

<div class="chat-wrapper">

  <div class="header">
    <div class="header-icon">🎓</div>
    <div class="header-text">
      <div class="title">Student Assistant</div>
      <div class="subtitle">
        <span class="online-dot"></span> Online — here to help
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-row bot">
      <div class="bubble">Hello! I'm your Student Assistant. Feel free to ask me anything about the school.</div>
    </div>
  </div>

  <div class="quick-bar">
    <span class="quick-label">Quick questions</span>
    <button class="quick-btn" onclick="sendHint('hello')">Greeting</button>
    <button class="quick-btn" onclick="sendHint('location')">📍 Location</button>
    <button class="quick-btn" onclick="sendHint('schedule')">🕗 Schedule</button>
  </div>

  <div class="input-area">
    <input id="userInput" type="text" placeholder="Ask a question..."
           onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script>
  // ─── KEYWORD DATA ─────────────────────────────────────────────
  // keywords : array of words/phrases — ANY of them will trigger this entry
  // question : the full question shown as a suggestion chip
  // response : the answer sent when matched
  const keywords = [
    {
      keywords: ["hello", "hi", "hey", "good morning", "good afternoon"],
      question: "Hello / Greeting",
      response: "Hello! How can I assist you today?"
    },
    {
      keywords: ["location", "where", "address", "located", "find you"],
      question: "Where is the school located?",
      response: "📍 We are located in Bangkok."
    },
    {
      keywords: ["schedule", "time", "start", "class", "when", "open"],
      question: "What time does school start?",
      response: "🕗 School starts at 8:00 AM."
    },
  ];

  // Top questions shown as fallback when nothing matches at all
  const TOP_FALLBACK_COUNT = 3;
  // ──────────────────────────────────────────────────────────────

  function getWords(str) {
    return str.toLowerCase().split(/\s+/).filter(Boolean);
  }

  function matchesEntry(input, entry) {
    const lower = input.toLowerCase();
    return entry.keywords.some(kw => lower.includes(kw.toLowerCase()));
  }

  function partialMatchesEntry(input, entry) {
    const inputWords = getWords(input);
    return entry.keywords.some(kw =>
      inputWords.some(word => kw.toLowerCase().includes(word) || word.includes(kw.toLowerCase().split(' ')[0]))
    );
  }

  function getResult(input) {
    // 1. Full keyword match
    for (const entry of keywords) {
      if (matchesEntry(input, entry)) {
        return { type: 'answer', text: entry.response };
      }
    }

    // 2. Partial word match — show only similar suggestions
    const partial = keywords.filter(entry => partialMatchesEntry(input, entry));
    if (partial.length > 0) {
      return { type: 'suggest', matches: partial };
    }

    // 3. No match — show top fallback questions
    return { type: 'fallback' };
  }

  // ── DOM helpers ──────────────────────────────────────────────

  function scrollBottom() {
    const box = document.getElementById('messages');
    box.scrollTop = box.scrollHeight;
  }

  function addMessage(text, who) {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg-row ${who}`;
    row.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(row);
    scrollBottom();
    return row;
  }

  function showTyping() {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>`;
    box.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function addSuggestions(matches, intro) {
    const box = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const chips = matches.map(m =>
      `<button class="suggestion-chip" onclick="sendHint('${m.keywords[0]}')">${m.question}</button>`
    ).join('');
    row.innerHTML = `
      <div class="bubble">
        ${intro}
        <div class="suggestions">
          <span class="suggestions-label">Suggestions</span>
          ${chips}
        </div>
      </div>`;
    box.appendChild(row);
    scrollBottom();
  }

  // ── Main logic ───────────────────────────────────────────────

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    input.disabled = true;

    showTyping();

    setTimeout(() => {
      hideTyping();
      input.disabled = false;
      input.focus();

      const result = getResult(text);

      if (result.type === 'answer') {
        addMessage(result.text, 'bot');

      } else if (result.type === 'suggest') {
        addSuggestions(result.matches, "I'm not sure what you mean. Did you mean one of these?");

      } else {
        // Fallback — show most common questions
        const fallback = keywords.slice(0, TOP_FALLBACK_COUNT);
        addSuggestions(fallback, "I couldn't find anything related to that. Here are some things I can help with:");
      }
    }, 900);
  }

  function sendHint(kw) {
    document.getElementById('userInput').value = kw;
    sendMessage();
  }
</script>

</body>
</html>
